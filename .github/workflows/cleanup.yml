# Every hour: delete games older than 3 hours whose host never pressed "Finish & delete"
# (closed laptop, crashed browser). Uses only the public web config — no secrets.
name: Delete old games

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: node scripts/cleanup-stale.ts
